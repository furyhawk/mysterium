[project]
name = "mysterium"
version = "0.2.3"
description = "RAG-powered research platform — upload documents, search with verity-rag, and synthesize reports with pydantic-deep agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.117.0",
    "fastapi==0.115.6",
    "httpx>=0.28.1",
    # >=2.18.0 required for the local WebFetch(native=False, local=True)
    # capability (markdownify-based local web-fetch tool).
    "markdownify>=1.2",
    # <2.32.0: pydantic-ai-slim 2.32+ migrated from `httpx` to `httpx2`. The
    # anthropic SDK (as of 0.125.x) still validates `http_client` against the
    # old `httpx.AsyncClient`, so a httpx2 client passed to AsyncAnthropic
    # fails with "Invalid `http_client` argument; Expected an instance of
    # `httpx.AsyncClient` but got <class 'httpx2.AsyncClient'>". Keep the
    # whole agent stack on `httpx` until the anthropic SDK supports httpx2
    # (anthropic>=1.0.0) or pydantic-ai bridges the two.
    "pydantic-ai-slim>=2.18.0,<2.32.0",
    "pydantic-deep>=0.3.20",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.51.0",
    "verity-rag>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/furyhawk/mysterium"
Repository = "https://github.com/furyhawk/mysterium"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.scripts]
mysterium = "mysterium.main:main"

# Restrict package discovery to the `mysterium` package only. Without this,
# setuptools' flat-layout auto-discovery also picks up `frontend/` (and other
# top-level dirs) as candidate packages and fails the build with
# "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools.packages.find]
include = ["mysterium*"]
