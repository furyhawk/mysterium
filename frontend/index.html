<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🔬</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mysterium — RAG Research Platform</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong palette. Kept dependency-free; main.ts reuses the same <link>.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('mysterium.theme') || 'null');
          var id = (saved && saved.themeId) || 'github-dark';
          var mode = saved && saved.mode === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.dataset.theme = id;
          root.classList.toggle('dark', mode === 'dark');
          root.style.colorScheme = mode;
          var link = document.createElement('link');
          link.id = 'theme-stylesheet';
          link.rel = 'stylesheet';
          link.href = new URL('themes/' + id + '/theme.css', document.baseURI).href;
          document.head.appendChild(link);
        } catch (e) {
          /* noop — the app falls back to the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
