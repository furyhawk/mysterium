[project]
name = "mysterium"
version = "0.2.3"
description = "RAG-powered research platform — upload documents, search with verity-rag, and synthesize reports with pydantic-deep agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # >=1.0.0: anthropic migrated from `httpx` to `httpx2` (the pydantic fork)
    # in 1.0.0. It validates `http_client` against `httpx2.AsyncClient`, so it
    # must be paired with a pydantic-ai on the same httpx2 line (>=2.32.0).
    "anthropic>=1.0.0",
    "fastapi==0.115.6",
    "httpx>=0.28.1",
    # >=2.18.0 required for the local WebFetch(native=False, local=True)
    # capability (markdownify-based local web-fetch tool).
    "markdownify>=1.2",
    # >=2.32.0: pydantic-ai-slim migrated from `httpx` to `httpx2` in 2.32.0.
    # This is the httpx2 line, paired with anthropic>=1.0.0 (also httpx2).
    # Mixing an httpx-based pydantic-ai with an httpx2-based anthropic (or
    # vice versa) breaks agent construction with:
    #   Invalid `http_client` argument; Expected an instance of
    #   `httpx.AsyncClient` but got <class 'httpx2.AsyncClient'>
    "pydantic-ai-slim>=2.32.0",
    "pydantic-deep>=0.3.20",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.51.0",
    # <0.2.2: verity-rag 0.2.2 added `marker-pdf`, which pins `anthropic<1`.
    # That conflicts with anthropic>=1.0.0, so uv resolves back to 0.2.0.
    # The mysterium app talks to the RAG server over HTTP (never imports the
    # `verity_rag` package), so the cap is safe. Revisit if marker-pdf drops
    # the anthropic<1 pin.
    "verity-rag>=0.2.0,<0.2.2",
]

[project.urls]
Homepage = "https://github.com/furyhawk/mysterium"
Repository = "https://github.com/furyhawk/mysterium"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.scripts]
mysterium = "mysterium.main:main"

# Restrict package discovery to the `mysterium` package only. Without this,
# setuptools' flat-layout auto-discovery also picks up `frontend/` (and other
# top-level dirs) as candidate packages and fails the build with
# "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools.packages.find]
include = ["mysterium*"]
